---
---
<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title | escape }} &middot; {% endif %}{{ site.title | escape }}</title>
    {% feed_meta %}
    <link rel="icon" href="{{ '/assets/images/favicon/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="icon" href="{{ '/assets/images/favicon/favicon.ico' | relative_url }}" sizes="any">
    <link rel="apple-touch-icon" href="{{ '/assets/images/favicon/apple-touch-icon.png' | relative_url }}" sizes="180x180">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>

    <header class="site-header">
      <div class="container header-inner">
        <a class="site-title" href="{{ '/' | relative_url }}">Alex on APEX</a>
        <nav aria-label="Primary navigation">
          <a{% if page.url == '/' %} class="active" aria-current="page"{% endif %} href="{{ '/' | relative_url }}">Home</a>
          <a{% if page.url == '/about/' %} class="active" aria-current="page"{% endif %} href="{{ '/about/' | relative_url }}">About</a>
          <a{% if page.url == '/blog/' or page.layout == 'post' %} class="active" aria-current="page"{% endif %} href="{{ '/blog/' | relative_url }}">Blog</a>
          <a{% if page.url == '/contact/' %} class="active" aria-current="page"{% endif %} href="{{ '/contact/' | relative_url }}">Contact</a>
        </nav>
      </div>
    </header>

    <main id="content" class="container">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>&copy; {{ site.time | date: '%Y' }} Alexander Kluev. &middot; <a href="{{ '/contact/' | relative_url }}">Contact</a> &middot; <a href="https://github.com/akluev/akluev.github.io/discussions" target="_blank" rel="noopener noreferrer">Discussions</a> &middot; <a href="{{ '/feed.xml' | relative_url }}">RSS / Atom</a></p>
      </div>
    </footer>
  </body>
</html>
