---
---
<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title | escape }} &middot; {% endif %}{{ site.title | escape }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>

    <header class="site-header">
      <div class="container header-inner">
        <a class="site-title" href="{{ '/' | relative_url }}">Alexander Kluev</a>
        <nav aria-label="Primary navigation">
          <a{% if page.url == '/' %} class="active" aria-current="page"{% endif %} href="{{ '/' | relative_url }}">Home</a>
          <a{% if page.url == '/about/' %} class="active" aria-current="page"{% endif %} href="{{ '/about/' | relative_url }}">About</a>
          <a{% if page.url == '/blog/' or page.layout == 'post' %} class="active" aria-current="page"{% endif %} href="{{ '/blog/' | relative_url }}">Blog</a>
        </nav>
      </div>
    </header>

    <main id="content" class="container">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>&copy; {{ site.time | date: '%Y' }} Alexander Kluev.</p>
      </div>
    </footer>
  </body>
</html>
